[package]
name = "minigit"
version = "0.1.0"
edition = "2024"

[dependencies]
argh = "0.1.19"
chrono = "0.4.45"
flate2 = { version = "1.1.10", features = ["zlib-rs"] }
hex = "0.4.3"
itertools = "0.15.0"
nutype = "0.7.0"
sha1 = "0.11.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
winnow = { version = "1.0.4", features = ["simd"] }

[dev-dependencies]
hegeltest = { version = "0.45.3", features = ["chrono"] }
tar = "0.4.46"
tempfile = "3.27.0"
