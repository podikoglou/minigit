[package]
name = "minigit"
version = "0.1.0"
edition = "2024"

[dependencies]
bpaf = { version = "0.9.27", features = ["derive"] }
chrono = "0.4.45"
flate2 = { version = "1.1.10", features = ["zlib-rs"] }
hex = "0.4.3"
itertools = "0.15.0"
sha1 = "0.11.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
winnow = "1.0.4"

[dev-dependencies]
tar = "0.4.46"
tempfile = "3.27.0"
